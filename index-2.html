<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEET Backlog Tracker</title>
<meta name="theme-color" content="#EDF1F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<style>
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --sunken:#E2E8F1; --ink:#172033; --muted:#596479; --line:#D5DCE8;
  --focus:#3646C8; --ok:#178A5B; --warn:#B45309; --bad:#C0392B; --star:#D99A00;
  --r-s:10px; --r-m:16px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1522; --surface:#182033; --sunken:#212B42; --ink:#E9EDF5; --muted:#9BA6BC; --line:#2B3754;
    --focus:#8EA0FF; --ok:#3CC58E; --warn:#F2A954; --bad:#FF7B6B; --star:#F2B90F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1522; --surface:#182033; --sunken:#212B42; --ink:#E9EDF5; --muted:#9BA6BC; --line:#2B3754;
  --focus:#8EA0FF; --ok:#3CC58E; --warn:#F2A954; --bad:#FF7B6B; --star:#F2B90F; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

.wrap{max-width:880px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:env(safe-area-inset-top)}
#themeBtn{white-space:nowrap;flex:none}
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{font-size:21px;font-weight:700}
.chip{margin:0;padding:3px 10px;border-radius:99px;background:var(--sunken);font-size:13px;font-weight:600}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:none;padding:14px 2px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink);box-shadow:inset 0 3px 0 var(--ink)}

.primary{background:var(--ink);color:var(--bg);border:0;border-radius:var(--r-s);padding:10px 16px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);border-radius:var(--r-s);padding:9px 14px;font-weight:600}
.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);border-radius:var(--r-s);padding:9px 14px;font-weight:600}
.sm{padding:6px 10px;font-size:14px}

input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
textarea{resize:vertical}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600}
label.f small{font-weight:400;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px;margin-top:16px}
.panel>h2,.panel-h{font-size:19px;margin-bottom:10px}
.flush{padding:0;overflow:hidden}
.flush .panel-h{padding:16px 16px 6px;margin:0}
.muted{color:var(--muted)}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* overview hero */
.hero{margin-top:14px}
.hero .big{font:700 clamp(46px,13vw,76px)/1 var(--display);letter-spacing:-.03em}
.hero .big small{font-size:.38em;font-weight:600;color:var(--muted);margin:0 .14em 0 .04em}
.hero>p{margin:6px 0 16px;color:var(--muted)}
.seg{display:flex;gap:3px;height:28px}
.seg-part{position:relative;border-radius:8px;overflow:hidden;min-width:8px;
  background:rgba(128,140,160,.25);background:color-mix(in srgb,var(--c) 24%,transparent)}
.seg-part i{position:absolute;left:0;top:0;bottom:0;background:var(--c);transition:width .3s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:14px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));margin-right:6px}
.speeds{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.pillbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.strip{display:grid;grid-template-columns:repeat(3,1fr);margin:20px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{padding:12px 8px 12px 0}
.strip div+div{padding-left:14px;border-left:1px solid var(--line)}
.strip dt{font-size:13px;color:var(--muted)}
.strip dd{margin:2px 0 0;font:700 21px/1.2 var(--display)}
.strip small{font:500 13px var(--body);color:var(--muted)}

.bar{display:block;height:6px;border-radius:99px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ink));border-radius:99px;transition:width .3s}
.thin{height:8px;margin:10px 0 4px}

.subs{list-style:none;margin:0;padding:0}
.subrow{display:grid;grid-template-columns:1fr auto;gap:3px 12px;width:100%;text-align:left;background:none;border:0;
  border-left:6px solid var(--c);border-top:1px solid var(--line);padding:13px 14px}
.subrow .name{font:700 18px var(--display)}
.subrow .left{font-weight:600}
.subrow .bar{grid-column:1/-1;margin-top:4px}
.subrow .meta{grid-column:1/-1;font-size:13.5px;color:var(--muted)}

/* lecture rows */
.lecs{list-style:none;margin:0;padding:0}
.lec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.lec:first-child{border-top:0}
.lec input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--c,var(--ink))}
.lec-title{font-weight:600}
.lec.is-done .lec-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.lec-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13.5px;color:var(--muted);margin-top:2px}
.lec-meta .tag{color:var(--ink);font-weight:600}
.lec-note{font-size:13.5px;margin-top:4px;padding-left:8px;border-left:3px solid var(--line);color:var(--muted)}
.lec-tools{grid-column:2;display:flex;gap:8px;align-items:center;margin-top:4px}
.pill{border:1px solid var(--line);background:none;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.star{border:0;background:none;font-size:21px;line-height:1;color:var(--line);padding:0 2px}
.star[aria-pressed="true"]{color:var(--star)}

.toolbar{display:grid;gap:8px;grid-template-columns:1fr 1fr;margin-top:16px}
.toolbar .search,.toolbar .primary{grid-column:1/-1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .pillbtn{white-space:nowrap;flex:none}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0 2px;font-size:14px;color:var(--muted)}

.chap{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:var(--r-s);margin-top:10px}
.chap>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.chap>summary::-webkit-details-marker{display:none}
.chap-name{font-weight:700}
.chap-name::before{content:"+";display:inline-block;width:1.1em;color:var(--muted);font-weight:700}
.chap[open] .chap-name::before{content:"\2013"}
.chap-stat{font-size:13.5px;color:var(--muted);text-align:right}
.chap>summary .bar{grid-column:1/-1;margin-top:4px}
.chap-body{padding:0 14px 6px}
.chap-tools{display:flex;gap:8px;flex-wrap:wrap;padding:2px 0 10px}

.empty{text-align:center;padding:40px 12px}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 18px}
.empty .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* planner */
.fields{display:grid;gap:12px;grid-template-columns:1fr 1fr}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-size:14px;font-weight:600;padding:0;margin-bottom:6px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.verdict{font:600 20px/1.3 var(--display);margin:0 0 8px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:92px 1fr;gap:2px 10px;padding:12px 0;align-items:baseline}
.day>summary::-webkit-details-marker{display:none}
.day-when{font-weight:700}
.day-what{color:var(--muted);font-size:14px}
.day ul{margin:0 0 12px;padding-left:102px;color:var(--muted);font-size:14px}

/* history */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:1.5}
.chart .tlabel{fill:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:14px 0 0;border-top:1px solid var(--line)}
.stats div{padding:10px 0;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){padding-right:12px}
.stats div:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.stats dt{font-size:13px;color:var(--muted)}
.stats dd{margin:0;font:700 20px/1.25 var(--display)}

/* data */
.subedit{list-style:none;margin:0;padding:0}
.subedit li{display:grid;grid-template-columns:44px 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.subedit li:first-child{border-top:0}
.subedit input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.subedit .n{grid-column:2/-1;font-size:13px;color:var(--muted);margin-top:-6px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre{background:var(--sunken);border-radius:var(--r-s);padding:12px;overflow-x:auto;font-size:13px;line-height:1.5}
.preview{margin:10px 0 0;font-size:14px;color:var(--muted)}
details.help{margin-top:10px;font-size:14px}
details.help summary{cursor:pointer;font-weight:600}
details.help p{margin:8px 0}

dialog{border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--ink);padding:20px;
  width:min(520px,calc(100% - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,15,30,.55)}
dialog form{display:grid;gap:12px}
dialog h2{font-size:22px}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.checks label{display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px}
.checks input[type=checkbox]{width:20px;height:20px}
.dlg-actions{display:flex;gap:8px;align-items:center}
.grow{flex:1}

#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;
  display:none;align-items:center;gap:12px;max-width:calc(100% - 24px)}
#toast.show{display:flex}
#toast button{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;padding:0}

.ex{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:8px;font-size:13.5px;color:var(--muted)}
.ex-l{font-weight:600}
.ex select{width:auto;max-width:100%;padding:4px 8px;font-size:13.5px;border-radius:8px}
.pill.play{border-color:var(--ink);color:var(--ink)}
.pill.play:hover{background:var(--sunken)}
.hero>p.hero-sub{margin:-10px 0 16px}
.pace-box{margin-top:14px;padding:12px 14px;border-radius:var(--r-s);background:var(--sunken)}
.pace-big{font:700 clamp(28px,8vw,40px)/1.1 var(--display);letter-spacing:-.02em}
.pace-big span{font-size:.45em;font-weight:600;color:var(--muted)}
.pace-big em{font:600 14px var(--body);font-style:normal}
.split{list-style:none;margin:0;padding:0}
.split li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line)}
.split li:first-child{border-top:0}
.split .bar{grid-column:1/-1}
.timer{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(0,0,0,.28)}
.timer .t-what{flex:1 1 130px;min-width:0;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.timer .t-time{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 10px;font-weight:600;font-size:13px}
.timer.done .t-time{text-decoration:underline}
.has-timer #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
.has-timer .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
@media (min-width:760px){
  .wrap{padding:28px 24px 64px}
  .top{display:grid;grid-template-columns:1fr auto}
  .tabs{position:static;grid-column:1/-1;display:flex;gap:4px;background:none;border:0;border-bottom:1px solid var(--line);padding:0;margin-top:8px}
  .tabs button{padding:12px 16px;font-size:15px}
  .tabs button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--ink)}
  .lec{grid-template-columns:auto 1fr auto}
  .lec-tools{grid-column:3;margin-top:0}
  .toolbar{grid-template-columns:2fr 1fr 1fr auto}
  .toolbar .search,.toolbar .primary{grid-column:auto}
  .fields{grid-template-columns:repeat(4,1fr)}
  #toast{bottom:24px}
  .timer{left:auto;right:16px;bottom:16px;width:400px}
  .has-timer #toast{bottom:24px}
  .has-timer .wrap{padding-bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>NEET backlog tracker</h1>
      <p id="examchip" class="chip" hidden></p>
    </div>
    <button id="themeBtn" class="ghost sm" type="button">Dark</button>
    <nav class="tabs" aria-label="Sections">
      <button type="button" data-act="tab" data-v="overview">Overview</button>
      <button type="button" data-act="tab" data-v="lectures">Lectures</button>
      <button type="button" data-act="tab" data-v="plan">Plan</button>
      <button type="button" data-act="tab" data-v="history">History</button>
      <button type="button" data-act="tab" data-v="data">Data</button>
    </nav>
  </header>
  <main id="app"></main>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="dlgForm" autocomplete="off">
    <h2 id="dlgTitle">Add lecture</h2>
    <label class="f">Subject <select id="fSub"></select></label>
    <label class="f" id="newSubWrap" hidden>New subject name <input type="text" id="fNewSub" maxlength="40"></label>
    <label class="f">Chapter <input type="text" id="fChap" list="chapList" maxlength="120" required></label>
    <datalist id="chapList"></datalist>
    <label class="f">Lecture title <input type="text" id="fTitle" maxlength="160" required></label>
    <label class="f">Duration <small>Like 1:32:10, 45:00 or 1h 20m. A plain number means minutes.</small>
      <input type="text" id="fDur" placeholder="1:32:10" required></label>
    <label class="f">Notes time in minutes <small>Leave blank to use your default. 0 means no notes.</small>
      <input type="number" id="fNotes" min="0" max="600" step="5"></label>
    <div class="checks">
      <label><input type="checkbox" id="fDone"> Done</label>
      <label class="f" style="font-weight:600">Date done <input type="date" id="fDate"></label>
      <label><input type="checkbox" id="fDpp"> DPP done</label>
      <label><input type="checkbox" id="fNotesDone"> Notes done</label>
      <label><input type="checkbox" id="fStar"> Starred</label>
    </div>
    <label class="f">Note <textarea id="fNote" rows="2" maxlength="400"></textarea></label>
    <div class="dlg-actions">
      <button type="button" id="dlgDel" class="danger">Delete</button>
      <span class="grow"></span>
      <button type="button" id="dlgCancel" class="ghost">Cancel</button>
      <button type="submit" class="primary">Save lecture</button>
    </div>
  </form>
</dialog>

<dialog id="swapDlg" aria-labelledby="swapTitle">
  <form id="swapForm" autocomplete="off">
    <h2 id="swapTitle">Replace this lecture</h2>
    <p class="muted" id="swapWhat" style="margin:0"></p>
    <label class="f">Chapter<select id="swapSel"></select></label>
    <label class="f">Lecture<select id="swapLec"></select></label>
    <p class="muted" id="swapNote" style="margin:0;font-size:14px"></p>
    <div class="dlg-actions"><span class="grow"></span><button type="button" id="swapCancel" class="ghost">Cancel</button><button type="submit" class="primary">Replace</button></div>
  </form>
</dialog>

<div id="timer" class="timer" role="region" aria-label="Timer" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">This tracker needs JavaScript turned on.</p></noscript>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const KEY = 'neet-backlog-tracker-v1';
const PALETTE = ['#7A5AF8', '#0EA5B7', '#C2410C', '#65A30D', '#DB2777', '#0F766E'];
const KNOWN = { physics: '#2F6FED', chemistry: '#E8890C', botany: '#1F9D6B', zoology: '#D6457A', biology: '#1F9D6B' };
const SPEEDS = [1, 1.25, 1.5, 1.75, 2];
const DAYS = [['Mon', 1], ['Tue', 2], ['Wed', 3], ['Thu', 4], ['Fri', 5], ['Sat', 6], ['Sun', 0]];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDate = s => { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const midnight = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => fmtDate(new Date());
const fmtDay = d => d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const fmtFull = d => d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = s => parseDate(s).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

function fmtDur(sec) {
  const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60), mm = m % 60;
  return h ? h + 'h ' + mm + 'm' : mm + 'm';
}
function durHTML(sec) {
  const m = Math.round(Math.max(0, sec) / 60), h = Math.floor(m / 60), mm = m % 60;
  return (h ? h + '<small>h</small> ' : '') + mm + '<small>m</small>';

function chartHTML(n) {
  const today = midnight(), days = [];
  for (let i = n - 1; i >= 0; i--) days.push(addDays(today, -i));
  const per = {};
  for (const l of S.lectures) if (l.done && l.doneAt) { const o = per[l.doneAt] || (per[l.doneAt] = {}); o[l.sub] = (o[l.sub] || 0) + l.dur; }
  const tot = days.map(d => Object.values(per[fmtDate(d)] || {}).reduce((a, b) => a + b, 0));
  const dpx = getDaily(), wlx = getWL(), targetC = dpx.B * (wlx.total ? wlx.watch / wlx.total : 1) * S.settings.speed;
  const maxSec = Math.max(Math.max.apply(null, tot), targetC, 3600);
  const maxH = Math.max(1, Math.ceil(maxSec / 3600)), stepH = Math.max(1, Math.ceil(maxH / 4)), top = Math.ceil(maxH / stepH) * stepH;
  const W = 420, H = 220, L = 36, R = 8, T = 10, B = 26, pw = W - L - R, ph = H - T - B, slot = pw / n, bw = Math.max(3, slot * 0.7);
  const y = sec => T + ph - (sec / 3600) / top * ph;
  const lstep = n <= 7 ? 1 : n <= 14 ? 2 : n <= 30 ? 5 : 10;
  let g = '';
  for (let h = 0; h <= top; h += stepH) {
    const yy = T + ph - h / top * ph;
    g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + h + 'h</text>';
  }
  days.forEach((d, i) => {
    const o = per[fmtDate(d)] || {}; let acc = 0, bars = '';
    const x = L + i * slot + (slot - bw) / 2;
    for (const s of S.subjects) {
      const v = o[s.id]; if (!v) continue;
      const y1 = y(acc + v), y0 = y(acc);
      bars += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, y0 - y1).toFixed(1) + '" fill="' + s.color + '" rx="2"/>';
      acc += v;
    }
    g += '<g><title>' + esc(fmtDay(d)) + ': ' + (tot[i] ? fmtDur(tot[i]) : 'nothing done') + '</title><rect x="' + (L + i * slot).toFixed(1) + '" y="' + T + '" width="' + slot.toFixed(1) + '" height="' + ph + '" fill="transparent"/>' + bars + '</g>';
    if ((n - 1 - i) % lstep === 0) g += '<text x="' + (L + i * slot + slot / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + d.getDate() + (d.getDate() === 1 || i === 0 ? ' ' + MONTHS[d.getMonth()] : '') + '</text>';
  });
  const ty = y(targetC);

/* toast */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');

}

  const box = $('#impPreview'), run = $('#impRun');

  if (res.kind === 'backup') {
    box.textContent = 'Backup file with ' + plural(res.data.lectures.length, 'lecture') + '. Importing it replaces everything currently in the tracker.';
    lastParse = res; run.disabled = false; return;
  }

/* ---------- timer (notes and revision) ---------- */
const TKEY = 'neet-backlog-timer-v1', BASE_TITLE = document.title;
let TIMER = null, tSig = '', audioCtx = null;
try { TIMER = JSON.parse(localStorage.getItem(TKEY)); } catch (e) { TIMER = null; }
if (!TIMER || typeof TIMER !== 'object' || !TIMER.kind) TIMER = null;
function saveTimer() { try { if (TIMER) localStorage.setItem(TKEY, JSON.stringify(TIMER)); else localStorage.removeItem(TKEY); } catch (e) { /* ignore */ } }
const timerLeft = () => !TIMER ? 0 : (TIMER.running ? Math.max(0, Math.ceil((TIMER.endAt - Date.now()) / 1000)) : TIMER.left);
function fmtClock(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), x = sec % 60;
  return (h ? h + ':' + pad(m) : m) + ':' + pad(x);
}
function logTime(kind, sec) {
  sec = Math.round(sec);
  if (sec <= 0) return;
  const d = todayStr(), key = kind === 'notes' ? 'notes' : 'rev', e = S.timeLog[d] || (S.timeLog[d] = { notes: 0, rev: 0 });
  e[key] = (e[key] || 0) + sec;
  save();
}
function flushTimer() {
  if (!TIMER) return;
  const el = TIMER.total - timerLeft();
  logTime(TIMER.kind, el - (TIMER.logged || 0));
  TIMER.logged = el;
}
function beep() {
  try {
    const c = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25, 0.5].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(c.destination);
      o.start(c.currentTime + t); o.stop(c.currentTime + t + 0.15);
    });
  } catch (e) { /* no audio */ }
}
function startTimer(kind, id) {
  let min, label;
  if (kind === 'notes') {
    const l = S.lectures.find(x => x.id === id);
    if (!l) return;
    min = notesMin(l); label = l.chapter + ', ' + l.title;
  } else { min = S.settings.revMin; label = 'Daily revision'; id = ''; }
  if (!min) { toast(kind === 'notes' ? 'Pick a notes time for this lecture first.' : 'Set your daily revision time on the Plan tab first.'); return; }
  if (TIMER && !TIMER.finished && !confirm('A timer is already running. Replace it?')) return;
  if (TIMER) flushTimer();
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.resume) audioCtx.resume(); } catch (e) { /* ignore */ }
  TIMER = { kind, id, label, total: min * 60, left: min * 60, running: true, endAt: Date.now() + min * 60000, finished: false, logged: 0 };
  saveTimer(); renderTimer();
}
function timerToggle() {
  if (!TIMER || TIMER.finished) return;
  if (TIMER.running) { TIMER.left = timerLeft(); TIMER.running = false; }
  else { TIMER.running = true; TIMER.endAt = Date.now() + TIMER.left * 1000; }
  saveTimer(); renderTimer();
}
function timerAdd(sec) {
  if (!TIMER) return;
  if (TIMER.finished) { TIMER.finished = false; TIMER.left = 0; TIMER.running = true; TIMER.endAt = Date.now(); }
  if (TIMER.running) TIMER.endAt += sec * 1000; else TIMER.left += sec;
  TIMER.total += sec;
  saveTimer(); renderTimer();
}
function timerStop() { flushTimer(); TIMER = null; saveTimer(); renderTimer(); }
function timerDone() {
  if (!TIMER) return;
  if (TIMER.kind === 'notes') {
    const l = S.lectures.find(x => x.id === TIMER.id);
    if (l && !l.notesDone) { l.notesDone = true; l.notesAt = todayStr(); }
  } else S.revDone[todayStr()] = true;
  flushTimer(); TIMER = null; saveTimer(); save(); renderTimer(); render(true);
  toast('Marked done.');
}
function tick() {
  if (!TIMER) return;
  if (TIMER.running && timerLeft() <= 0) {
    TIMER.running = false; TIMER.left = 0; TIMER.finished = true;
    flushTimer(); saveTimer(); beep();
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) { /* ignore */ }
    toast('Time is up: ' + TIMER.label);
  }
  renderTimer();
}
function renderTimer() {
  const box = $('#timer');
  if (!TIMER) { box.hidden = true; box.innerHTML = ''; tSig = ''; document.body.classList.remove('has-timer'); document.title = BASE_TITLE; return; }
  const left = timerLeft();
  const sig = [TIMER.kind, TIMER.id, TIMER.running, TIMER.finished].join('|');
  if (sig !== tSig) {
    tSig = sig;
    box.className = 'timer' + (TIMER.finished ? ' done' : '');
    box.innerHTML = '<div class="t-what"><b>' + (TIMER.kind === 'notes' ? 'Notes' : 'Revision') + (TIMER.finished ? ', time is up' : '') + '</b><br>' + esc(TIMER.label) + '</div>' +
      '<div class="t-time"></div>' +
      (TIMER.finished ? '' : '<button type="button" data-act="t-toggle">' + (TIMER.running ? 'Pause' : 'Resume') + '</button>') +
      '<button type="button" data-act="t-add">+5 min</button>' +
      '<button type="button" data-act="t-done">Mark done</button>' +
      '<button type="button" data-act="t-stop">Close</button>';
    box.hidden = false;
    document.body.classList.add('has-timer');
  }
  $('.t-time', box).textContent = fmtClock(left);
  document.title = TIMER.finished ? 'Time is up - ' + BASE_TITLE : (TIMER.running ? fmtClock(left) + ' - ' + BASE_TITLE : BASE_TITLE);
}
function liveDays(v) {
  const big = $('#paceBig'), n = Math.round(+v);
  if (!big || !(n >= 1)) return;
  const T = totalForDays(Math.min(n, 730));
  big.innerHTML = durHTML(T) + ' <span>a day</span>' + (T > MAX_DAY ? ' <em class="bad">too many hours</em>' : '');

/* ---------- events ---------- */
document.addEventListener('click', e => {

  if (!el || el.tagName !== 'BUTTON') return;
  const act = el.dataset.act, id = el.dataset.id, l = id && S.lectures.find(x => x.id === id);
  switch (act) {
    case 'tab': go(el.dataset.v); break;
    case 'goto-sub': UI.sub = id; UI.status = 'pending'; UI.q = ''; go('lectures'); break;
    case 'chip-sub': UI.sub = id; render(true); break;
    case 'speed': S.settings.speed = +el.dataset.v; save(); UI.focus = '[data-act="speed"][data-v="' + el.dataset.v + '"]'; render(true); break;
    case 'star': if (l) { l.star = !l.star; save(); UI.focus = '[data-act="star"][data-id="' + id + '"]'; render(true); } break;
    case 'dpp': if (l) { l.dpp = !l.dpp; save(); UI.focus = '[data-act="dpp"][data-id="' + id + '"]'; render(true); } break;
    case 'edit': openDlg(id); break;
    case 'add': openDlg(); break;
    case 'load-builtin': loadBuiltin(false); break;
    case 'expand': { const ds = $$('details.chap'); const any = ds.some(d => d.open); ds.forEach(d => { d.open = !any; }); break; }
    case 'ch-notes': {
      const key = el.dataset.key, i = key.indexOf('||'), sub = key.slice(0, i), ch = key.slice(i + 2);
      const v = prompt('Minutes of notes time for every lecture in this chapter. Leave blank to use your default (' + S.settings.notesMin + ' min).', '');
      if (v === null) break;
      if (v.trim() !== '' && isNaN(+v)) { toast('Enter a number of minutes.'); break; }
      const n = v.trim() === '' ? null : clampInt(v, 0, 600, 0);
      const ls = S.lectures.filter(x => x.sub === sub && x.chapter === ch);
      ls.forEach(x => { x.notes = n; });
      save(); render(true); toast('Notes time set for ' + plural(ls.length, 'lecture') + '.');
      break;
    }
    case 'ch-all': case 'ch-rename': case 'ch-del': {
      const key = el.dataset.key, i = key.indexOf('||'), sub = key.slice(0, i), ch = key.slice(i + 2);
      const ls = S.lectures.filter(x => x.sub === sub && x.chapter === ch);
      if (act === 'ch-all') {
        const anyPending = ls.some(x => !x.done);
        const before = ls.map(x => [x, x.done, x.doneAt, x.notesDone, x.notesAt]);
        ls.forEach(x => { if (anyPending) { if (!x.done) { setDone(x, true); x.notesDone = true; x.notesAt = ''; } } else setDone(x, false); });

/* ===== chapter priority and your own to-dos ===== */

const splitKey = key => { const i = key.indexOf('||'); return [key.slice(0, i), key.slice(i + 2)]; };
function chapterKeys() {
  const seen = new Set(), out = [];
  for (const l of S.lectures) { const k = l.sub + '||' + l.chapter; if (!seen.has(k)) { seen.add(k); out.push(k); } }
  return out;
}
/* module practice plan of a chapter: its own setting, else the subject setting */
function modPlan(sub, ch) {
  const key = sub + '||' + ch, m = S.mods[key] || {}, d = S.modDef[sub] || {};
  const days = m.days != null ? m.days : (d.days || 0), min = m.min != null ? m.min : (d.min || 0);
  if (!(days > 0 && min > 0)) return null;
  return { key, days, min, done: Math.min(days, m.done || 0), last: m.last || '', started: !!m.started };
}
function workDoneToday() {
  const t = todayStr();
  let backlog = 0;
  for (const l of S.lectures) {
    if (l.done && l.doneAt === t) backlog += eff(l.dur);
    if (l.notesDone && l.notesAt === t) backlog += notesMin(l) * 60;
  }
  for (const k of S.todos) if (k.done && k.doneAt === t) backlog += k.min * 60;
  for (const key of chapterKeys()) {
    const m = S.mods[key];
    if (m && m.last === t) { const sc = splitKey(key), pl = modPlan(sc[0], sc[1]); if (pl) backlog += pl.min * 60; }
  }
  return { backlog, rev: revDoneToday() ? Math.max(0, S.settings.revMin) * 60 : 0 };
}
function getWL() {
  if (WL) return WL;
  const items = workItems(), bySub = {};
  let watch = 0, notes = 0, mod = 0;
  for (const t of items) { watch += t.watch; notes += t.notes; bySub[t.l.sub] = (bySub[t.l.sub] || 0) + t.sec; }
  const todo = sum(S.todos.filter(k => !k.done), k => k.min * 60);
  for (const key of chapterKeys()) { const sc = splitKey(key), pl = modPlan(sc[0], sc[1]); if (pl) mod += Math.max(0, pl.days - pl.done) * pl.min * 60; }
  return (WL = { items, watch, notes, total: watch + notes, todo, mod, bySub });
}
function totalForDays(n) {
  const wl = getWL(), done = workDoneToday();
  return Math.max(300, (wl.total + wl.todo + wl.mod + done.backlog) / studyDaysN(n)) + Math.max(0, S.settings.revMin) * 60;
}
function getDaily() {
  if (DAILY) return DAILY;
  const st = S.settings, wl = getWL(), done = workDoneToday();
  const R0 = Math.max(0, st.revMin) * 60;
  let T, B, R, mode = 'hours', n = 0;
  if (st.paceMode === 'days' && st.deadline && daysLeft() > 0) {
    mode = 'days'; n = studyDaysN(daysLeft());
    R = R0; B = Math.max(300, (wl.total + wl.todo + wl.mod + done.backlog) / n); T = B + R;
  } else {
    T = st.hours * 3600; R = Math.min(R0, Math.max(0, T - 900)); B = T - R;
  }
  return (DAILY = { T, B, R, R0, mode, n });
}
function getPlan() {
  if (PLAN) return PLAN;
  const dp = getDaily(), mode = S.settings.mode, days = [], all = getWL().items;
  const pri = t => S.chapPri[t.l.sub + '||' + t.l.chapter];
  /* first: notes catch-up, then lectures of chapters you gave a priority (1 first), in any subject */
  const firstUp = all.filter(t => t.kind === 'lecture' && pri(t) != null).sort((a, b) => pri(a) - pri(b));
  const cu = { q: all.filter(t => t.kind === 'notes').concat(firstUp), p: 0 };
  const qs = S.subjects.map(x => ({ id: x.id, q: [], p: 0 }));
  const qmap = new Map(qs.map(x => [x.id, x]));
  for (const t of all) if (t.kind === 'lecture' && pri(t) == null) { const x = qmap.get(t.l.sub); if (x) x.q.push(t); }
  const tq = S.todos.filter(k => !k.done).sort((a, b) => a.date.localeCompare(b.date)); /* your own tasks use up part of each day */
  let tp = 0;
  const live = () => qs.filter(x => x.p < x.q.length);
  const left = () => cu.p < cu.q.length || live().length > 0;
  const doneB = workDoneToday().backlog, todayS = todayStr();
  /* lectures you replaced for today: from -> to. The replaced one goes back to the front of its queue afterwards. */
  const swapMap = new Map(((S.swaps[todayS] || {}).pairs || []).map(p => [p.from, p.to]));
  const deferred = [];
  const takeTask = id => {
    for (const home of [cu].concat(qs)) {
      for (let i = home.p; i < home.q.length; i++) if (home.q[i].kind === 'lecture' && home.q[i].l.id === id) return home.q.splice(i, 1)[0];
    }
    return null;
  };
  /* module practice: one session a day per subject, for chapters you have started, side by side with the lectures */
  const act = [], actKeys = new Set();
  const addAct = (sub, ch) => {
    const pl = modPlan(sub, ch);
    if (!pl || actKeys.has(pl.key) || pl.days - pl.done <= 0) return;
    actKeys.add(pl.key);
    act.push({ key: pl.key, sub, chapter: ch, min: pl.min, days: pl.days, rem: pl.days - pl.done, last: pl.last });
  };
  for (const key of chapterKeys()) {
    const sc = splitKey(key), m = S.mods[key];
    if ((m && m.started) || S.lectures.some(l => l.sub === sc[0] && l.chapter === sc[1] && l.done)) addAct(sc[0], sc[1]);
  }
  const modLeft = () => act.some(a => a.rem > 0);
  let d = midnight(), first = true, guard = 0, rr = 0, debt = 0;
  while ((left() || modLeft()) && guard < 3000) {
    const off = !first && S.settings.off.includes(d.getDay());
    if (!off) {
      const ds = fmtDate(d);
      let todoSec = 0;
      while (tp < tq.length && tq[tp].date <= ds) todoSec += tq[tp++].min * 60;
      const mods = [], seen = new Set();
      let modSec = 0;
      for (const a of act) {
        if (a.rem <= 0 || seen.has(a.sub)) continue;
        seen.add(a.sub);
        if (first && a.last === todayS) continue;          /* today's session is already done and counted */
        mods.push({ key: a.key, sub: a.sub, chapter: a.chapter, min: a.min, n: a.days - a.rem + 1, days: a.days });
        a.rem--; modSec += a.min * 60;
      }
      const allow = Math.max(0, (first ? Math.max(0, dp.B - doneB) : dp.B) - todoSec - modSec);
      const room = Math.max(0, allow - debt);
      const dayNum = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);
      const lv = live();
      const pool = mode === 'two' && lv.length > 2 ? [lv[dayNum % lv.length], lv[(dayNum + 1) % lv.length]] : lv;
      if (mode === 'mix' && first) rr = dayNum;
      let k = 0, used = 0;
      const dayItems = [];
      const pickRaw = () => {
        if (cu.p < cu.q.length) return cu.q[cu.p++];
        const lv2 = live();
        if (!lv2.length) return null;
        let cand;
        if (mode === 'one') cand = lv2[0];
        else if (mode === 'mix') { cand = lv2[rr % lv2.length]; rr++; }
        else { const pl = pool.filter(x => x.p < x.q.length); cand = pl.length ? pl[k++ % pl.length] : lv2[0]; }
        return cand.q[cand.p++];
      };
      const pickNext = () => {
        for (let g = 0; g < 60; g++) {
          const t = pickRaw();
          if (!t) return null;
          const to = first && t.kind === 'lecture' ? swapMap.get(t.l.id) : null;
          if (!to) return t;
          deferred.push(t);
          const r = takeTask(to);
          if (r) return r;
        }
        return null;
      };
      while (used < room) {
        if (used === 0 && room < 600) break;
        const t = pickNext();
        if (!t) break;
        dayItems.push(t); used += t.sec;
      }
      debt += used - allow;
      for (const t of dayItems) if (t.kind === 'lecture') addAct(t.l.sub, t.l.chapter);   /* their module starts the next day */
      if (dayItems.length || mods.length) days.push({ date: new Date(d), items: dayItems, sec: used, mods, modSec });
      if (first) for (const t of deferred) { const home = pri(t) != null ? cu : qmap.get(t.l.sub); home.q.splice(home.p, 0, t); }
    }
    first = false; d = addDays(d, 1); guard++;
  }
  return (PLAN = days);
}

function parseTodo(raw, minField) {

  if (m && m[1].trim()) { if (!min) min = Math.round(parseDuration(m[2]) / 60); text = m[1].trim(); }

function todayPanel(plan) {
  const dp = getDaily(), done = workDoneToday(), wl = getWL(), revDone = revDoneToday(), ts = todayStr();
  const dt = done.backlog + (revDone ? dp.R : 0);
  const pct = Math.min(100, dp.T ? dt / dp.T * 100 : 0);
  const day0 = plan.length && fmtDate(plan[0].date) === ts ? plan[0] : null;
  const q = day0 ? day0.items : [], mods = day0 ? day0.mods : [];
  const modsDone = chapterKeys().map(key => {
    const m = S.mods[key];
    if (!m || m.last !== ts) return null;

  if (!p.text) { toast('Type the task first.'); return; }
  if (!p.min) { toast('Add how long it takes, like 45 min.'); return; }
  S.todos.push({ id: uid(), text: p.text, min: Math.min(600, p.min), date: f.elements.date.value || todayStr(), done: false, doneAt: '' });
  save(); render(true); toast('Added: ' + p.text);
});
document.addEventListener('change', e => {
  const el = e.target, act = el.dataset && el.dataset.act;
  if (!act) return;
  if (act === 'todo-done') {
    const k = S.todos.find(x => x.id === el.dataset.id);
    if (!k) return;
    k.done = el.checked; k.doneAt = el.checked ? todayStr() : '';
    save(); render(true);
  } else if (act === 'mod-done') {
    const key = el.dataset.key, sc = splitKey(key), pl = modPlan(sc[0], sc[1]);
    if (!pl) return;
    const m = S.mods[key] || (S.mods[key] = { days: null, min: null, done: 0, last: '', started: false });
    if (el.checked) { m.done = Math.min(pl.days, (m.done || 0) + 1); m.last = todayStr(); }
    else { m.done = Math.max(0, (m.done || 0) - 1); if (m.last === todayStr()) m.last = ''; }
    save(); render(true);
  } else if (act === 'moddef-days' || act === 'moddef-min') {
    const d = S.modDef[el.dataset.id] || (S.modDef[el.dataset.id] = {});
    if (act === 'moddef-days') d.days = clampInt(el.value, 0, 60, 0); else d.min = clampInt(el.value, 0, 240, 0);
    save(); render(true);
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName !== 'BUTTON') return;
  if (el.dataset.act === 'todo-del') {
    const i = S.todos.findIndex(x => x.id === el.dataset.id);
    if (i < 0) return;
    const k = S.todos.splice(i, 1)[0];
    save(); render(true);
    toast('Task removed.', () => { S.todos.push(k); save(); render(true); });
  } else if (el.dataset.act === 'ch-pri') {
    const key = el.dataset.key, cur = S.chapPri[key];
    const v = prompt('Priority for this chapter. 1 is done first, then 2, 3 and so on. Leave blank to clear.', cur != null ? cur : '');
    if (v === null) return;
    if (v.trim() === '') delete S.chapPri[key];
    else if (isNaN(+v) || +v < 1) { toast('Enter a number from 1 up.'); return; }
    else S.chapPri[key] = Math.round(+v);
    save(); render(true);
    toast(v.trim() === '' ? 'Priority cleared.' : 'Priority set. It now comes first in your to-do list.');
  }
});

/* ----- replace a lecture for today with one from another chapter ----- */
let SWAP_FROM = null;
const swapPairs = () => ((S.swaps[todayStr()] || {}).pairs || []);
function isSwappedIn(id) { return swapPairs().some(p => p.to === id); }
function lecturesInChapter(key) {
  const i = key.indexOf('||'), sub = key.slice(0, i), ch = key.slice(i + 2), plan = getPlan();
  const taken = new Set(plan.length && fmtDate(plan[0].date) === todayStr() ? plan[0].items.map(t => t.l.id) : []);
  taken.add(SWAP_FROM);
  swapPairs().forEach(p => taken.add(p.from));
  return S.lectures.filter(x => x.sub === sub && x.chapter === ch && !x.done && !taken.has(x.id));
}
function fillSwapLecs() {
  const ls = lecturesInChapter($('#swapSel').value);
  $('#swapLec').innerHTML = ls.map(l => '<option value="' + l.id + '">' + esc(l.title) + ' (' + fmtDur(eff(l.dur)) + ')</option>').join('');
  $('#swapLec').disabled = !ls.length;
  $('#swapNote').textContent = ls.length ? 'Pick any lecture from this chapter. The first one is the next in order.' : 'No other lecture is left in that chapter.';
}
function openSwap(id) {
  const l = S.lectures.find(x => x.id === id);
  if (!l) return;
  SWAP_FROM = id;
  $('#swapWhat').textContent = 'Now planned for today: ' + l.title + ', ' + l.chapter + '. It stays in your list for a later day.';
  let h = '';
  for (const s of S.subjects) {
    const opts = Array.from(new Set(S.lectures.filter(x => x.sub === s.id).map(x => x.chapter))).map(ch => {
      const n = S.lectures.filter(x => x.sub === s.id && x.chapter === ch && !x.done).length;
      return n ? '<option value="' + esc(s.id + '||' + ch) + '">' + esc(ch) + ' (' + n + ' left)</option>' : '';
    }).join('');
    if (opts) h += '<optgroup label="' + esc(s.name) + '">' + opts + '</optgroup>';
  }
  $('#swapSel').innerHTML = h;
  $('#swapSel').value = l.sub + '||' + l.chapter;
  if (!$('#swapSel').value && $('#swapSel').options.length) $('#swapSel').selectedIndex = 0;
  fillSwapLecs();
  $('#swapDlg').showModal();
}
$('#swapSel').addEventListener('change', fillSwapLecs);
$('#swapCancel').addEventListener('click', () => $('#swapDlg').close());
$('#swapForm').addEventListener('submit', e => {
  e.preventDefault();
  const to = S.lectures.find(x => x.id === $('#swapLec').value);
  if (!to) { toast('No other lecture is left in that chapter.'); return; }
  const snap = JSON.stringify(S.swaps), t = todayStr();
  for (const k of Object.keys(S.swaps)) if (k !== t) delete S.swaps[k];
  const day = S.swaps[t] || (S.swaps[t] = { pairs: [] });
  const ex = day.pairs.find(p => p.to === SWAP_FROM);
  if (ex) ex.to = to.id; else day.pairs.push({ from: SWAP_FROM, to: to.id });
  save(); $('#swapDlg').close(); render(true);
  toast('Today you do ' + to.title + ' from ' + to.chapter + ' instead.', () => { S.swaps = JSON.parse(snap); save(); render(true); });
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName !== 'BUTTON') return;
  if (el.dataset.act === 'swap') openSwap(el.dataset.id);
  else if (el.dataset.act === 'swap-undo') {
    const day = S.swaps[todayStr()];
    if (!day) return;
    day.pairs = day.pairs.filter(p => p.to !== el.dataset.id);
    save(); render(true); toast('Put back in your list.');
  }
});

/* ----- module buttons on a chapter ----- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName !== 'BUTTON') return;
  const act = el.dataset.act;
  if (act !== 'ch-mod' && act !== 'ch-modstart') return;
  const key = el.dataset.key, sc = splitKey(key);
  const mk = () => S.mods[key] || (S.mods[key] = { days: null, min: null, done: 0, last: '', started: false });
  if (act === 'ch-mod') {
    const pl = modPlan(sc[0], sc[1]);
    const v = prompt('Module time for this chapter: days, then minutes a day, like 5, 50. Leave blank to use the subject setting. Type 0 to turn it off.', pl ? pl.days + ', ' + pl.min : '');
    if (v === null) return;
    const t = v.trim(), m = mk();
    if (t === '') { m.days = null; m.min = null; }
    else if (t === '0') { m.days = 0; m.min = 0; }
    else {
      const mm = t.match(/^(\d+)\D+(\d+)$/);
      if (!mm || +mm[1] < 1 || +mm[2] < 1) { toast('Type days and minutes, like 5, 50.'); return; }
      m.days = clampInt(mm[1], 1, 60, 5); m.min = clampInt(mm[2], 1, 240, 50);
    }
    save(); render(true);
  } else {
    mk().started = true;
    save(); render(true); toast('This module starts today.');
  }
});

/* ---------- start ---------- */
if (!S.lectures.length && !S.seeded) loadBuiltin(true); else render();
renderTimer();
setInterval(tick, 1000);
})();
</script>
